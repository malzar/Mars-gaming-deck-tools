name: Build MGDC

on:
  push:
    branches: [main]
    paths: ["mgdc/**", ".github/workflows/build-mgdc.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mgdc
    steps:
      - uses: actions/checkout@v4
      - name: Compilar y empaquetar
        shell: pwsh
        run: ./package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: com.malzar.mgdc.sdPlugin
          path: mgdc/dist/com.malzar.mgdc.sdPlugin.zip
          retention-days: 30
