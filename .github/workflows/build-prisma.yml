name: Build Prisma

on:
  push:
    branches: [main]
    paths: ["prisma/**", ".github/workflows/build-prisma.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: prisma
    steps:
      - uses: actions/checkout@v4
      - name: Compilar y empaquetar
        shell: pwsh
        run: ./package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: com.malzar.prisma.sdPlugin
          path: prisma/dist/com.malzar.prisma.sdPlugin.zip
          retention-days: 30
