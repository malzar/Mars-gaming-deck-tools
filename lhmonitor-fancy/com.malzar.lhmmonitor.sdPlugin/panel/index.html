<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LHMonitor fancy</title>
<style>
  :root {
    --bg: #f4f3ef; --card: #ffffff; --soft: #f1efe8; --text: #1f1e1c; --muted: #6b6a65; --faint: #9a988f;
    --border: rgba(0,0,0,.12); --accent: #2f7de1; --accent-bg: #e6f1fb; --accent-tx: #185fa5;
    --ok: #3b6d11; --danger: #c43a3a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161616; --card: #202020; --soft: #2a2a2a; --text: #ececec; --muted: #a3a3a3; --faint: #777;
      --border: rgba(255,255,255,.12); --accent: #5aa2ff; --accent-bg: #0c2c4f; --accent-tx: #b5d4f4;
      --ok: #97c459; --danger: #ff7b7b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 "Segoe UI", system-ui, sans-serif; }
  .wrap { max-width: 780px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
  .lbl { font-size: 12px; color: var(--muted); margin: 0 0 8px; }
  input, button { font: inherit; color: var(--text); }
  input[type=text], input[type=number] { height: 32px; padding: 0 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); }
  input[type=number] { width: 72px; }
  button { font-size: 13px; padding: 6px 12px; border: 1px solid var(--border); border-radius: 8px; background: transparent; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  button:hover { background: var(--soft); }
  button.primary { border-color: var(--accent); color: var(--accent); }
  button.small { font-size: 12px; padding: 3px 8px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
  .tab.on { border-color: var(--accent); background: var(--accent-bg); color: var(--accent-tx); }
  .grid { display: grid; grid-template-columns: minmax(0,1fr) 200px; gap: 12px; }
  .met { display: grid; grid-template-columns: 20px minmax(0,1fr) 40px 104px; align-items: center; gap: 8px; padding: 5px 0; font-size: 13px; }
  .met.na { color: var(--faint); }
  .met input[type=color] { width: 38px; height: 26px; padding: 0; border: 1px solid var(--border); border-radius: 6px; background: none; cursor: pointer; }
  .met .th { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
  .met .th input { width: 58px; height: 28px; font-size: 12px; }
  .unit { color: var(--faint); font-size: 12px; }
  .chk { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 4px 0; }
  .chk.off { color: var(--faint); }
  .times { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center; font-size: 13px; }
  .els { display: grid; grid-template-columns: repeat(auto-fill, minmax(138px, 1fr)); gap: 6px; }
  .chip { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; cursor: grab; user-select: none; background: var(--card); min-width: 0; }
  .chip.on { border-color: var(--accent); background: var(--accent-bg); color: var(--accent-tx); }
  .chip.hid { border-style: dashed; color: var(--faint); }
  .chip .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip small { font-size: 11px; color: var(--faint); flex-shrink: 0; }
  .chip .ren { border: 0; padding: 0 2px; font-size: 12px; color: var(--faint); background: none; }
  .chip input[type=text] { height: 24px; width: 100%; font-size: 12px; }
  .chip.drop { outline: 2px dashed var(--accent); }
  .key { width: 144px; height: 144px; border-radius: 14px; background: #0e1116; cursor: pointer; display: block; user-select: none; }
  .seq { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
  .seq span { font-size: 11px; padding: 2px 6px; border-radius: 6px; background: var(--soft); color: var(--muted); }
  .seq span.on { background: var(--accent-bg); color: var(--accent-tx); }
  .err { font-size: 13px; color: var(--danger); margin: 6px 0 0; }
  .okmsg { font-size: 13px; color: var(--ok); }
  .help { font-size: 12px; color: var(--muted); line-height: 1.7; border-top: 1px solid var(--border); padding-top: 8px; align-self: stretch; }
  svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div style="display:flex;align-items:center;gap:8px">
    <svg class="i" viewBox="0 0 24 24" style="color:var(--accent);width:20px;height:20px"><path d="M2 13h4l2.5-6 3.5 11 3-8 2 3h5"/></svg>
    <strong style="font-size:16px;flex:1">LHMonitor fancy</strong>
    <span id="connState" style="font-size:12px"></span>
  </div>

  <div class="card" style="margin-top:12px">
    <p class="lbl" data-t="conn"></p>
    <div style="display:flex;gap:8px">
      <input type="text" id="url" style="flex:1;font-family:Consolas,monospace;font-size:12px" spellcheck="false">
      <button id="test" data-t="test"></button>
    </div>
    <p id="testMsg" style="margin:6px 0 0;font-size:12px;color:var(--muted)"></p>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="grid">
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="card">
        <p class="lbl" id="metLbl"></p>
        <div id="mets"></div>
        <p class="err hidden" id="metErr"></p>
        <div id="combo" style="border-top:1px solid var(--border);margin-top:8px;padding-top:6px">
          <label class="chk" id="cbWrap"><input type="checkbox" id="combined"><span data-t="combined"></span></label>
          <label class="chk" id="onlyWrap"><input type="checkbox" id="onlyCombined"><span data-t="only"></span></label>
        </div>
      </div>
      <div class="card">
        <p class="lbl" data-t="times"></p>
        <div class="times">
          <span data-t="rotate"></span><span><input type="number" id="rotateSec" min="1" max="3600" step="1"> s</span>
          <span data-t="refresh"></span><span><input type="number" id="refreshMs" min="250" max="10000" step="250"> ms</span>
          <span data-t="clicks"></span><span><input type="number" id="clickMs" min="150" max="1000" step="50"> ms</span>
        </div>
      </div>
    </div>
    <div class="card" style="display:flex;flex-direction:column;align-items:center;gap:8px">
      <p class="lbl" style="align-self:flex-start" data-t="preview"></p>
      <img class="key" id="key" alt="" draggable="false">
      <div id="act" style="font-size:12px;color:var(--accent);min-height:18px;text-align:center"></div>
      <div class="seq" id="seq"></div>
      <div class="help" id="help"></div>
    </div>
  </div>

  <div class="card" style="margin-top:12px">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap">
      <p class="lbl" style="margin:0;flex:1" data-t="elements"></p>
      <label class="chk" style="font-size:12px;color:var(--muted)"><input type="checkbox" id="showHidden"><span data-t="showHidden"></span></label>
      <button class="small" id="selAll" data-t="all"></button>
    </div>
    <div class="els" id="els"></div>
    <p class="err hidden" id="elErr"></p>
  </div>

  <div style="display:flex;gap:8px;margin-top:12px;align-items:center">
    <span id="saveMsg" class="okmsg" style="flex:1"></span>
    <button id="close" data-t="close"></button>
    <button id="save" class="primary" data-t="save"></button>
  </div>
</div>

<script>
const TXT = {
  es: {
    conn: 'Conexión con Libre Hardware Monitor', test: 'Probar', ok: 'Conectado', off: 'Sin conexión',
    metLbl: 'Datos a mostrar (máximo 3)', metLblSingle: 'Dato a mostrar', na: 'no disponible', red: 'rojo ≥',
    combined: 'Incluir la vista combinada en el ciclo', only: 'Mostrar solo la vista combinada',
    times: 'Tiempos', rotate: 'Cambiar de elemento cada', refresh: 'Actualizar datos cada', clicks: 'Ventana de pulsaciones',
    preview: 'Vista previa (pulsa la tecla)', elements: 'Elementos en la rotación (arrastra para ordenar)',
    showHidden: 'Mostrar ocultos', all: 'Todos', close: 'Cerrar', save: 'Guardar', saved: 'Guardado',
    max3: 'Máximo 3 datos a la vez', min1: 'Elige al menos un dato', minEl: 'Deja al menos un elemento',
    idle: 'sin tráfico', dead: 'no gira', rename: 'Renombrar', combinedMode: 'Todos',
    help: '<b>1 clic</b> · cambiar dato<br><b>2 clics</b> · pausa / sigue<br><b>3 clics</b> · siguiente',
    a1: '1 clic · dato', a1none: '1 clic · solo hay un modo', a2p: '2 clics · pausa', a2r: '2 clics · sigue', a3: '3 clics · siguiente',
    testing: 'Probando…', found: 'Encontrado', noEls: 'LHM no muestra elementos de esta categoría en este equipo.',
    unsaved: 'Hay cambios sin guardar. ¿Cerrar igualmente?',
  },
  en: {
    conn: 'Libre Hardware Monitor connection', test: 'Test', ok: 'Connected', off: 'Not connected',
    metLbl: 'Values to show (up to 3)', metLblSingle: 'Value to show', na: 'not available', red: 'red ≥',
    combined: 'Include the combined view in the cycle', only: 'Show only the combined view',
    times: 'Timing', rotate: 'Switch item every', refresh: 'Refresh data every', clicks: 'Multi-click window',
    preview: 'Preview (click the key)', elements: 'Items in rotation (drag to reorder)',
    showHidden: 'Show hidden', all: 'All', close: 'Close', save: 'Save', saved: 'Saved',
    max3: 'Up to 3 values at once', min1: 'Pick at least one value', minEl: 'Keep at least one item',
    idle: 'no traffic', dead: 'not spinning', rename: 'Rename', combinedMode: 'All',
    help: '<b>1 click</b> · next value<br><b>2 clicks</b> · pause / resume<br><b>3 clicks</b> · next item',
    a1: '1 click · value', a1none: '1 click · only one mode', a2p: '2 clicks · paused', a2r: '2 clicks · resumed', a3: '3 clicks · next',
    testing: 'Testing…', found: 'Found', noEls: 'LHM shows no items of this category on this PC.',
    unsaved: 'You have unsaved changes. Close anyway?',
  },
};
const ICONS = {
  cpu: '<rect x="6" y="6" width="12" height="12" rx="1.5"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>',
  gpu: '<rect x="3" y="6" width="18" height="11" rx="1.5"/><circle cx="13" cy="11.5" r="3.5"/><path d="M5 17v3"/>',
  mem: '<rect x="3" y="7" width="18" height="8" rx="1"/><path d="M6 10v2M10 10v2M14 10v2M18 10v2M5 15v3M19 15v3"/>',
  disk: '<rect x="4" y="4" width="16" height="5" rx="1.5"/><rect x="4" y="10" width="16" height="5" rx="1.5"/><rect x="4" y="16" width="16" height="4" rx="1.5"/>',
  net: '<path d="M8 19V5M4 9l4-4 4 4M16 5v14M12 15l4 4 4-4"/>',
  fan: '<circle cx="12" cy="12" r="2"/><path d="M12 10c0-4 1-7 4-7 2 0 2 3-1 5M14 12c4 0 7 1 7 4 0 2-3 2-5-1M10 12c-4 0-7-1-7-4 0-2 3-2 5 1M12 14c0 4-1 7-4 7-2 0-2-3 1-5"/>',
  board: '<rect x="3" y="3" width="18" height="18" rx="2"/><rect x="7" y="7" width="5" height="5"/><path d="M12 9.5h5M9.5 12v5h7"/>',
};

const qs = new URLSearchParams(location.search);
const CTX = qs.get('ctx') || '';
const $ = (id) => document.getElementById(id);
let t = TXT.es, cat = {}, draft = null, saved = '', lang = 'es';
let view = { mode: 0, paused: false, pos: 0 }, total = 0, modes = [];
let clicks = 0, clickTimer = null, rotTimer = null, prevTimer = null, drag = null;

const api = (p, body) => fetch(p + (p.includes('?') ? '&' : '?') + 'ctx=' + encodeURIComponent(CTX), body
  ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }
  : { cache: 'no-store' }).then(async (r) => { const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || r.status); return j; });
const C = () => draft.cats[draft.category];
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dirty = () => JSON.stringify(draft) !== saved;

function applyLang() {
  t = TXT[lang] || TXT.en;
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach((e) => { e.textContent = t[e.dataset.t]; });
  $('help').innerHTML = t.help;
}

function setConn(ok, err) {
  $('connState').innerHTML = ok ? `<span style="color:var(--ok)">● ${t.ok}</span>` : `<span style="color:var(--danger)">● ${t.off}${err ? ' · ' + esc(err) : ''}</span>`;
}

// ---------------------------------------------------------------- pestañas --
function renderTabs() {
  $('tabs').innerHTML = Object.entries(cat).map(([k, c]) =>
    `<button class="tab ${k === draft.category ? 'on' : ''}" data-cat="${k}"><svg class="i" viewBox="0 0 24 24">${ICONS[k] || ''}</svg>${esc(c.name)}</button>`).join('');
  $('tabs').querySelectorAll('[data-cat]').forEach((b) => b.onclick = () => {
    draft.category = b.dataset.cat; view = { mode: 0, paused: false, pos: 0 };
    hideErrors(); renderAll();
  });
}

// ------------------------------------------------------------------ datos --
function renderMetrics() {
  const cc = cat[draft.category], c = C();
  $('metLbl').textContent = cc.single ? t.metLblSingle : t.metLbl;
  $('mets').innerHTML = cc.metrics.map((m) => {
    const on = c.metrics.includes(m.k);
    const th = c.thresholds[m.k] ?? m.th;
    return `<label class="met ${m.available ? '' : 'na'}">
      <input type="checkbox" data-k="${m.k}" ${on ? 'checked' : ''} ${cc.single || !m.available ? 'disabled' : ''}>
      <span>${esc(m.name)} <span class="unit">${esc(m.unit || '°C · V')}${m.available ? '' : ' · ' + t.na}</span></span>
      <input type="color" data-c="${m.k}" value="${c.colors[m.k] || m.color}" ${m.available ? '' : 'disabled'}>
      <span class="th">${m.th !== undefined ? `${t.red} <input type="number" data-th="${m.k}" value="${th}" step="1" ${m.available ? '' : 'disabled'}>` : ''}</span>
    </label>`;
  }).join('');
  $('mets').querySelectorAll('[data-k]').forEach((e) => e.onchange = () => {
    const k = e.dataset.k;
    if (e.checked) {
      if (c.metrics.length >= 3) { e.checked = false; showErr('metErr', t.max3); return; }
      c.metrics = cc.metrics.map((m) => m.k).filter((x) => x === k || c.metrics.includes(x));
    } else {
      if (c.metrics.length === 1) { e.checked = true; showErr('metErr', t.min1); return; }
      c.metrics = c.metrics.filter((x) => x !== k);
    }
    hideErrors(); view.mode = 0; renderCombo(); refreshPreview();
  });
  $('mets').querySelectorAll('[data-c]').forEach((e) => e.oninput = () => { c.colors[e.dataset.c] = e.value; refreshPreview(); });
  $('mets').querySelectorAll('[data-th]').forEach((e) => e.oninput = () => {
    c.thresholds[e.dataset.th] = e.value === '' ? '' : Number(e.value); refreshPreview();
  });
  renderCombo();
}

function renderCombo() {
  const c = C(), single = cat[draft.category].single, can = c.metrics.length >= 2;
  $('combo').classList.toggle('hidden', single);
  $('combined').checked = !!c.combined; $('onlyCombined').checked = !!c.onlyCombined;
  $('combined').disabled = !can || c.onlyCombined; $('onlyCombined').disabled = !can;
  $('cbWrap').classList.toggle('off', !can || c.onlyCombined); $('onlyWrap').classList.toggle('off', !can);
}
$('combined').onchange = (e) => { C().combined = e.target.checked; view.mode = 0; refreshPreview(); };
$('onlyCombined').onchange = (e) => { C().onlyCombined = e.target.checked; view.mode = 0; renderCombo(); refreshPreview(); };

// ------------------------------------------------------------- elementos --
function orderedEls() {
  const els = cat[draft.category].elements, c = C();
  const byId = new Map(els.map((e) => [e.id, e]));
  const ids = c.order.filter((id) => byId.has(id));
  for (const e of els) if (!ids.includes(e.id)) ids.push(e.id);
  c.order = ids;
  return ids.map((id) => byId.get(id));
}
const isOn = (e) => C().enabled[e.id] ?? e.defaultOn;

function renderEls() {
  const c = C(), show = $('showHidden').checked, els = orderedEls();
  $('els').innerHTML = '';
  if (!els.length) { $('els').innerHTML = `<p style="margin:0;font-size:13px;color:var(--muted);grid-column:1/-1">${t.noEls}</p>`; return; }
  els.forEach((e, i) => {
    const on = isOn(e);
    if (e.hidden && !on && !show) return;
    const d = document.createElement('div');
    d.className = 'chip' + (on ? ' on' : '') + (e.hidden && !on ? ' hid' : '');
    d.draggable = true;
    const label = c.names[e.id] || e.name;
    d.title = e.name + (e.hidden ? ' · ' + t[e.hidden] : '');
    d.innerHTML = `<input type="checkbox" ${on ? 'checked' : ''} style="margin:0;flex-shrink:0">
      <span class="nm">${esc(label)}</span>
      ${e.tag ? `<small>${esc(e.tag)}</small>` : ''}${e.unit ? `<small>${esc(e.unit)}</small>` : ''}
      <button class="ren" title="${t.rename}">✎</button>`;
    d.querySelector('input').onchange = (ev) => {
      const active = els.filter(isOn).length;
      if (!ev.target.checked && active === 1) { ev.target.checked = true; showErr('elErr', t.minEl); return; }
      hideErrors(); c.enabled[e.id] = ev.target.checked; view.pos = 0; renderEls(); refreshPreview();
    };
    d.querySelector('.ren').onclick = (ev) => {
      ev.preventDefault();
      const nm = d.querySelector('.nm');
      const inp = document.createElement('input');
      inp.type = 'text'; inp.value = label; inp.maxLength = 24;
      nm.replaceWith(inp); inp.focus(); inp.select();
      const done = () => { const v = inp.value.trim(); if (v && v !== e.name) c.names[e.id] = v; else delete c.names[e.id]; renderEls(); refreshPreview(); };
      inp.onblur = done; inp.onkeydown = (k) => { if (k.key === 'Enter') inp.blur(); if (k.key === 'Escape') { inp.value = label; inp.blur(); } };
    };
    d.ondragstart = () => { drag = i; };
    d.ondragover = (ev) => { ev.preventDefault(); d.classList.add('drop'); };
    d.ondragleave = () => d.classList.remove('drop');
    d.ondrop = () => {
      d.classList.remove('drop');
      if (drag === null || drag === i) return;
      const [m] = c.order.splice(drag, 1); c.order.splice(i, 0, m); drag = null;
      renderEls(); refreshPreview();
    };
    $('els').appendChild(d);
  });
}
$('showHidden').onchange = renderEls;
$('selAll').onclick = () => { const c = C(); for (const e of cat[draft.category].elements) if (!e.hidden) c.enabled[e.id] = true; renderEls(); refreshPreview(); };

// ---------------------------------------------------------------- tiempos --
['rotateSec', 'refreshMs', 'clickMs'].forEach((k) => $(k).onchange = () => {
  const v = Number($(k).value); if (Number.isFinite(v)) draft[k] = v; restartTimers(); refreshPreview();
});

// ------------------------------------------------------------ vista previa --
async function refreshPreview() {
  try {
    const r = await api('/api/preview', { settings: draft, state: view });
    $('key').src = r.png; total = r.total; modes = r.modes;
    $('seq').innerHTML = cat[draft.category].single ? '' : modes.map((m, i) => {
      const name = m === 'all' ? t.combinedMode : (cat[draft.category].metrics.find((x) => x.k === m)?.name || m);
      return `<span class="${i === ((view.mode % modes.length) + modes.length) % modes.length ? 'on' : ''}">${esc(name)}</span>`;
    }).join('');
    setConn(r.connected);
  } catch (e) { setConn(false, e.message); }
}
function flash(s) { $('act').textContent = s; clearTimeout(flash.t); flash.t = setTimeout(() => $('act').textContent = '', 1500); }
$('key').onclick = () => {
  clicks++; clearTimeout(clickTimer);
  clickTimer = setTimeout(() => {
    if (clicks === 1) { if (modes.length > 1) { view.mode = (view.mode + 1) % modes.length; flash(t.a1); } else flash(t.a1none); }
    else if (clicks === 2) { view.paused = !view.paused; flash(view.paused ? t.a2p : t.a2r); }
    else { if (total > 1) view.pos = (view.pos + 1) % total; flash(t.a3); restartTimers(); }
    clicks = 0; refreshPreview();
  }, Math.max(150, Number(draft.clickMs) || 350));
};
function restartTimers() {
  clearInterval(rotTimer); clearInterval(prevTimer);
  rotTimer = setInterval(() => { if (!view.paused && total > 1) { view.pos = (view.pos + 1) % total; refreshPreview(); } }, Math.max(1, Number(draft.rotateSec) || 3) * 1000);
  prevTimer = setInterval(refreshPreview, Math.max(250, Number(draft.refreshMs) || 1000));
}

// ------------------------------------------------------------- conexión --
$('test').onclick = async () => {
  $('testMsg').textContent = t.testing; $('testMsg').style.color = 'var(--muted)';
  try {
    const r = await api('/api/test', { url: $('url').value.trim() });
    if (r.ok) {
      $('testMsg').style.color = 'var(--ok)';
      $('testMsg').textContent = `${t.found}: ` + Object.entries(r.counts).map(([k, n]) => `${cat[k]?.name || k} ${n}`).join(' · ');
      await load(true);
    } else { $('testMsg').style.color = 'var(--danger)'; $('testMsg').textContent = r.error; }
  } catch (e) { $('testMsg').style.color = 'var(--danger)'; $('testMsg').textContent = e.message; }
};

// ------------------------------------------------------------- guardar --
function showErr(id, msg) { $(id).textContent = msg; $(id).classList.remove('hidden'); }
function hideErrors() { ['metErr', 'elErr'].forEach((id) => $(id).classList.add('hidden')); }
$('save').onclick = async () => {
  try {
    draft.state = { ...draft.state, mode: 0, pos: 0, paused: false };
    await api('/api/save', { settings: draft, url: $('url').value.trim() });
    saved = JSON.stringify(draft);
    $('saveMsg').textContent = t.saved; setTimeout(() => $('saveMsg').textContent = '', 2500);
  } catch (e) { $('saveMsg').textContent = e.message; $('saveMsg').className = 'err'; }
};
$('close').onclick = () => { if (!dirty() || confirm(t.unsaved)) window.close(); };

// -------------------------------------------------------------- arranque --
function renderAll() {
  renderTabs(); renderMetrics(); renderEls();
  $('rotateSec').value = draft.rotateSec; $('refreshMs').value = draft.refreshMs; $('clickMs').value = draft.clickMs;
  refreshPreview();
}
async function load(keepDraft) {
  try {
    const s = await api('/api/state');
    lang = s.lang; applyLang(); cat = s.catalog;
    if (!keepDraft || !draft) { draft = s.settings; saved = JSON.stringify(draft); $('url').value = s.url; }
    setConn(s.connected, s.error);
    renderAll(); restartTimers();
  } catch (e) {
    applyLang();
    document.querySelector('.wrap').innerHTML = `<div class="card"><p class="err" style="margin:0">${esc(e.message)}</p></div>`;
  }
}
load();
</script>
</body>
