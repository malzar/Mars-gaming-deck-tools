<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title data-i18n="prisma_entrar_cambiar_perfil">Prisma · Entrar / cambiar perfil</title>
<style>
  :root { color-scheme: dark; --bg: #2d2d2d; --field: #3d3d3d; --border: #4a4a4a; --text: #d8d8d8; --muted: #9a9a9a; }
  body { margin: 0; padding: 10px 12px; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, "Segoe UI", sans-serif; }
  .row { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 8px; align-items: center; margin-bottom: 10px; }
  .row > label:first-child { color: var(--muted); }
  select { width: 100%; height: 28px; padding: 0 6px; background: var(--field); color: var(--text); border: 1px solid var(--border); border-radius: 4px; font: inherit; }
  .note { color: var(--muted); font-size: 12px; margin: 4px 0 10px; }
</style>
</head>
<body>
  <div class="row">
    <label for="profile" data-i18n="perfil">Perfil</label>
    <select id="profile"><option value="" data-i18n="el_elegido_con_la">El elegido con la rueda</option></select>
  </div>
  <div class="row">
    <label for="show" data-i18n="ensenar">Enseñar</label>
    <select id="show">
      <option value="iconname" data-i18n="icono_y_nombre">Icono y nombre</option>
      <option value="icon" data-i18n="solo_icono">Solo icono</option>
      <option value="name" data-i18n="solo_nombre">Solo nombre</option>
    </select>
  </div>
  <p class="note" data-i18n="pulsar_cambia_a_ese">Pulsar: cambia a ese perfil y, si tiene subperfiles, la rueda pasa a recorrerlos. Mantener pulsado (más de medio segundo): sube un nivel sin cambiar de perfil.</p>
  <p class="note" data-i18n="los_subperfiles_el_orden">Los subperfiles, el orden y los iconos se ponen en el panel de Prisma, pestaña «Perfiles».</p>
<script src="i18n.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  let ws = null, uuid = '', action = '', settings = {};
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  function save() { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ event: 'setSettings', context: uuid, action, payload: settings })); }
  $('profile').onchange = () => { settings.profile = $('profile').value; save(); };
  $('show').onchange = () => { settings.show = $('show').value; save(); };
  function fill(tree) {
    const opts = [`<option value="">${T('el_elegido_con_la')}</option>`].concat(tree.map((p) =>
      `<option value="${esc(p.id)}">${'   '.repeat(p.depth)}${p.depth ? '└ ' : ''}${esc(p.name)}</option>`));
    if (settings.profile && !tree.some((p) => p.id === settings.profile)) opts.push(`<option value="${esc(settings.profile)}">${esc(settings.profile)} (?)</option>`);
    $('profile').innerHTML = opts.join('');
    $('profile').value = settings.profile || '';
  }
  window.connectElgatoStreamDeckSocket = (port, inUuid, registerEvent, info, actionInfo) => {
    window.prismaLang(info);
    uuid = inUuid;
    const ai = typeof actionInfo === 'string' ? JSON.parse(actionInfo) : actionInfo;
    action = ai.action;
    settings = Object.assign({ profile: '', show: 'iconname' }, ai.payload && ai.payload.settings);
    $('show').value = settings.show;
    ws = new WebSocket('ws://127.0.0.1:' + port);
    ws.onopen = () => {
      ws.send(JSON.stringify({ event: registerEvent, uuid }));
      ws.send(JSON.stringify({ event: 'sendToPlugin', context: uuid, action, payload: { request: 'tree' } }));
    };
    ws.onmessage = (m) => {
      const msg = JSON.parse(m.data);
      if (msg.event === 'didReceiveSettings' && msg.payload) { settings = Object.assign(settings, msg.payload.settings); $('show').value = settings.show || 'iconname'; $('profile').value = settings.profile || ''; }
      if (msg.event === 'sendToPropertyInspector' && msg.payload && msg.payload.tree) fill(msg.payload.tree);
    };
  };
</script>
</body>
</html>
