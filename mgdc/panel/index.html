<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MGDC · Ajustes</title>
<style>
  :root {
    --bg: #f4f3ef; --card: #ffffff; --soft: #f1efe8; --text: #1f1e1c; --muted: #6b6a65; --faint: #9a988f;
    --border: rgba(0,0,0,.12); --accent: #2f7de1; --accent-bg: #e6f1fb; --accent-tx: #185fa5;
    --ok: #3b6d11; --danger: #c43a3a; --day: rgba(239,159,39,.85); --night: rgba(55,138,221,.85);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161616; --card: #202020; --soft: #2a2a2a; --text: #ececec; --muted: #a3a3a3; --faint: #777;
      --border: rgba(255,255,255,.12); --accent: #5aa2ff; --accent-bg: #0c2c4f; --accent-tx: #b5d4f4;
      --ok: #97c459; --danger: #ff7b7b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 "Segoe UI", system-ui, sans-serif; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 16px; }
  .step { width: 30px; height: 30px; padding: 0; justify-content: center; font-size: 16px; line-height: 1; user-select: none; }
  #calCard input[type=range] { width: 130px; }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); overflow-x: auto; }
  .tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; padding: 8px 14px; color: var(--muted); white-space: nowrap; }
  .tabs button:hover { background: transparent; color: var(--text); }
  .tabs button.on { color: var(--accent-tx); border-bottom-color: var(--accent); }
  [data-tab].tabhide { display: none !important; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
  .lbl { font-size: 12px; color: var(--muted); margin: 0 0 8px; }
  input, button, select { font: inherit; color: var(--text); }
  input[type=text], input[type=number], input[type=time] { height: 32px; padding: 0 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); }
  input[type=number] { width: 76px; }
  input[type=range] { width: 170px; accent-color: var(--accent); }
  input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); }
  button { font-size: 13px; padding: 6px 12px; border: 1px solid var(--border); border-radius: 8px; background: transparent; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  button:hover { background: var(--soft); }
  button.primary { border-color: var(--accent); color: var(--accent); }
  .layout { display: grid; grid-template-columns: 200px minmax(0,1fr); gap: 12px; margin-top: 12px; }
  .dev { display: flex; flex-direction: column; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; background: var(--card); text-align: left; width: 100%; margin-bottom: 6px; }
  .dev.on { border-color: var(--accent); background: var(--accent-bg); }
  .dev small { font-size: 11px; color: var(--ok); }
  .row { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 10px 12px; align-items: center; font-size: 13px; }
  .off { color: var(--faint); }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; font-size: 12px; padding: 6px 12px; }
  .seg button.on { background: var(--accent-bg); color: var(--accent-tx); }
  .sl { display: flex; align-items: center; gap: 8px; }
  .sl span { min-width: 40px; text-align: right; }
  .tiles { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; margin: 8px 0 12px; }
  .tile { background: var(--soft); border-radius: 8px; padding: 10px; }
  .tile .k { font-size: 12px; color: var(--muted); }
  .tile .v { font-size: 20px; font-weight: 600; }
  #bar { position: relative; height: 32px; border-radius: 6px; overflow: hidden; background: var(--soft); margin-top: 14px; }
  .ticks { display: flex; justify-content: space-between; font-size: 11px; color: var(--faint); margin-top: 4px; }
  .msg { font-size: 13px; }
  .msg.ok { color: var(--ok); } .msg.err { color: var(--danger); }
  .hidden { display: none !important; }
  .empty { padding: 40px 16px; text-align: center; color: var(--muted); }
  #bgCanvas { width: 100%; height: auto; display: block; border-radius: 8px; border: 1px solid var(--border); background: #000; }
  .bgbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
  input[type=color] { width: 36px; height: 30px; padding: 0 2px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); }
  select { height: 32px; padding: 0 6px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); }
  button:disabled { opacity: .5; cursor: default; }
  .pl { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px; }
  .pc { position: relative; display: block; border: 1px solid var(--border); border-radius: 8px; padding: 5px 6px; font-size: 12px; text-align: left; background: var(--card); }
  .pc.on { border: 2px solid var(--accent); padding: 4px 5px; }
  .pc .sw { height: 14px; border-radius: 4px; margin-bottom: 3px; }
  .pc .del { position: absolute; top: 2px; right: 2px; border: 0; padding: 0 4px; font-size: 11px; color: var(--muted); }
  .ed { margin-top: 10px; padding: 10px; border: 1px dashed var(--border); border-radius: 8px; }
  .arow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 13px; }
  .arow > span:first-child { width: 58px; }
  [data-kind] button { padding: 6px 9px; }
  [data-kind] { flex-wrap: wrap; }
  .arow [data-test] { margin-left: auto; }
  .thumb { height: 30px; border-radius: 4px; border: 1px solid var(--border); }
</style>
</head>
<body>
<div class="wrap">
  <div style="display:flex;align-items:center;gap:8px">
    <strong style="font-size:16px;flex:1" id="title">MGDC · Mars Gaming Deck Controller</strong>
    <span style="font-size:12px;color:var(--muted)" id="version"></span>
  </div>

  <div id="empty" class="card empty hidden" style="margin-top:12px"></div>

  <div class="layout hidden" id="main">
    <div id="devices"></div>

    <div style="display:flex;flex-direction:column;gap:12px">
      <nav class="tabs" id="tabs">
        <button data-go="screen" data-t="tScreen"></button>
        <button data-go="bg" data-t="tBg"></button>
        <button data-go="icons" data-t="tIcons"></button>
        <button data-go="anims" data-t="tAnims"></button>
        <button data-go="info" data-t="tInfo"></button>
        <!-- PRUEBAS --><button data-go="debug">Debug</button><!-- /PRUEBAS -->
      </nav>
      <div class="card" data-tab="screen">
        <p class="lbl" data-t="screen"></p>
        <div class="row">
          <span data-t="brightness"></span>
          <span class="sl"><input type="range" id="brightness" min="0" max="100" step="1"><span id="brightnessV"></span></span>
          <span data-t="neverSleep"></span>
          <span><input type="checkbox" id="neverSleep"></span>
          <span id="sleepLbl" data-t="sleepAfter"></span>
          <span><input type="number" id="sleepMinutes" min="1" max="240" step="1"> min</span>
          <span data-t="swallow"></span>
          <span><input type="checkbox" id="swallow"></span>
        </div>
        <p id="briNote" class="hidden" style="font-size:12px;color:var(--muted);margin:8px 0 0" data-t="briNote"></p>
      </div>

      <div class="card" data-tab="screen">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
          <p class="lbl" style="margin:0;flex:1" data-t="dayNight"></p>
          <label style="font-size:13px;display:flex;align-items:center;gap:6px"><input type="checkbox" id="schedEnabled"><span data-t="enabled"></span></label>
        </div>
        <div id="schedBody">
          <div class="seg" style="margin-bottom:12px">
            <button data-mode="sun" data-t="modeSun"></button>
            <button data-mode="fixed" data-t="modeFixed"></button>
          </div>

          <div id="sunBox">
            <div style="display:flex;gap:8px;flex-wrap:wrap">
              <input type="text" id="city" list="cities" style="flex:1;min-width:160px" data-tp="cityPh">
              <datalist id="cities"></datalist>
              <input type="number" id="lat" step="0.0001" min="-90" max="90" title="Latitud" style="width:104px">
              <input type="number" id="lon" step="0.0001" min="-180" max="180" title="Longitud" style="width:104px">
            </div>
            <div class="tiles">
              <div class="tile"><div class="k" data-t="sunrise"></div><div class="v" id="sunrise">--:--</div></div>
              <div class="tile"><div class="k" data-t="sunset"></div><div class="v" id="sunset">--:--</div></div>
            </div>
            <div class="row" style="margin-bottom:10px">
              <span data-t="offset"></span>
              <span><input type="number" id="offset" step="5" min="-180" max="180"> min</span>
            </div>
          </div>

          <div id="fixBox" class="row" style="margin-bottom:10px">
            <span data-t="dayStart"></span><span><input type="time" id="dayStart"></span>
            <span data-t="nightStart"></span><span><input type="time" id="nightStart"></span>
          </div>

          <div class="row">
            <span data-t="dayBri"></span>
            <span class="sl"><input type="range" id="dayBri" min="0" max="100" step="5"><span id="dayBriV"></span></span>
            <span data-t="nightBri"></span>
            <span class="sl"><input type="range" id="nightBri" min="0" max="100" step="5"><span id="nightBriV"></span></span>
            <span data-t="transition"></span>
            <span><input type="number" id="transition" min="0" max="120" step="5"> min</span>
          </div>
          <div id="bar"></div>
          <div class="ticks"><span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>24:00</span></div>
        </div>
        <p id="schedOff" style="font-size:13px;color:var(--faint);margin:0" data-t="schedOff"></p>
      </div>

      <div class="card" data-tab="bg">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
          <p class="lbl" style="margin:0;flex:1" data-t="bg"></p>
          <span id="bgSize" style="font-size:12px;color:var(--faint)"></span>
        </div>
        <canvas id="bgCanvas" width="854" height="480"></canvas>
        <div class="bgbar">
          <div class="seg">
            <button data-src="image" data-t="bgSrcImage"></button>
            <button data-src="color" data-t="bgSrcColor"></button>
          </div>
          <span id="bgImageOpts" style="display:contents">
            <button id="bgPick" data-t="bgPick"></button>
            <input type="file" id="bgFile" accept="image/*" class="hidden">
            <div class="seg">
              <button data-fit="cover" data-t="bgCover"></button>
              <button data-fit="contain" data-t="bgContain"></button>
            </div>
          </span>
          <label id="bgColorBox" style="display:flex;align-items:center;gap:6px;font-size:13px"><span id="bgColorLbl"></span><input type="color" id="bgColor" value="#000000"></label>
        </div>
        <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px;font-size:13px">
          <span data-t="bgFix"></span>
          <select id="bgFix">
            <option value="none" data-t="fixNone"></option>
            <option value="mirror" data-t="fixMirror"></option>
            <option value="flip" data-t="fixFlip"></option>
            <option value="rotate" data-t="fixRotate"></option>
          </select>
          <span style="flex:1"></span>
          <button id="bgApply" class="primary" data-t="bgApply"></button>
        </div>
        <p style="font-size:12px;color:var(--muted);margin:8px 0 0" data-t="bgNote"></p>
      </div>

      <div class="card" data-tab="icons" id="calCard">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
          <p class="lbl" style="margin:0;flex:1" data-t="cal"></p>
          <span id="calState" style="font-size:12px;color:var(--faint)"></span>
        </div>
        <div style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:start">
          <div>
            <div class="seg" id="calZone" style="margin-bottom:14px"></div>
            <div class="row">
              <span data-t="calX"></span><span class="sl"><button class="step" data-step="calX" data-d="-1" aria-label="−">−</button><input type="range" id="calX" min="-20" max="20" step="1"><span id="calXV"></span><button class="step" data-step="calX" data-d="1" aria-label="+">+</button></span>
              <span data-t="calY"></span><span class="sl"><button class="step" data-step="calY" data-d="-1" aria-label="−">−</button><input type="range" id="calY" min="-20" max="20" step="1"><span id="calYV"></span><button class="step" data-step="calY" data-d="1" aria-label="+">+</button></span>
              <span data-t="calSize"></span><span class="sl"><button class="step" data-step="calS" data-d="-1" aria-label="−">−</button><input type="range" id="calS" min="60" max="120" step="1"><span id="calSV"></span><button class="step" data-step="calS" data-d="1" aria-label="+">+</button></span>
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px">
              <button id="calTest" data-t="calTest"></button>
              <button id="calReset" data-t="calReset"></button>
              <button id="calStop" data-t="calStop"></button>
            </div>
          </div>
          <canvas id="calCv" width="120" height="120" style="border-radius:10px;border:4px solid #222;background:#000"></canvas>
        </div>
        <p style="font-size:12px;color:var(--muted);margin:10px 0 0" data-t="calNote"></p>
      </div>

      <div class="card" data-tab="anims">
        <p class="lbl" data-t="anims"></p>
        <div id="animBody">
        <div class="arow">
          <span data-t="startup"></span>
          <div class="seg" data-kind="startup"></div>
          <span class="gifbox" data-gif="startup" style="display:flex;gap:6px;align-items:center"><button data-t="pickGif"></button><img class="thumb hidden" alt=""></span>
          <button data-test="startup" data-t="test"></button>
        </div>
        <div class="arow">
          <span data-t="shutdown"></span>
          <div class="seg" data-kind="shutdown"></div>
          <span class="gifbox" data-gif="shutdown" style="display:flex;gap:6px;align-items:center"><button data-t="pickGif"></button><img class="thumb hidden" alt=""></span>
          <button data-test="shutdown" data-t="test"></button>
        </div>
        <input type="file" id="gifFile" accept="image/gif" class="hidden">
        <div class="row" style="margin-bottom:10px">
          <span data-t="duration"></span>
          <span class="sl"><input type="range" id="animDur" min="0.5" max="4" step="0.5"><span id="animDurV"></span></span>
          <span data-t="reverse"></span>
          <span><input type="checkbox" id="animRev"></span>
          <span data-t="trail"></span>
          <span><div class="seg" id="animTrail"><button data-tr="0" data-t="noTrail"></button><button data-tr="1">1 paso</button><button data-tr="2">2 pasos</button><button data-tr="3">3 pasos</button><button data-tr="fixed" data-t="fixed"></button></div></span>
          <span data-t="endWith"></span>
          <select id="endWith"><option value="bg" data-t="endBg"></option><option value="off" data-t="endOff"></option></select>
        </div>
        <div id="colorsBox">
        <div class="arow" style="margin-bottom:8px">
          <span data-t="colors"></span>
          <div class="seg" id="animCm"><button data-cm="one" data-t="oneColor"></button><button data-cm="pal" data-t="palette"></button><button data-cm="rnd" data-t="rndColors"></button></div>
          <input type="color" id="animOne">
        </div>
        <div class="pl" id="animPal"></div>
        </div>
        <p id="oneNote" class="hidden" style="font-size:12px;color:var(--muted);margin:10px 0 0" data-t="oneNote"></p>
        <p style="font-size:12px;color:var(--muted);margin:10px 0 0" data-t="animNote"></p>
        </div>
      </div>

      <div class="ed hidden" id="palEd" data-tab="anims">
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;font-size:13px">
          <span data-t="name"></span><input type="text" id="palName" style="width:160px">
          <span style="flex:1"></span><span id="palErr" class="msg err"></span>
        </div>
        <div id="palStops" style="display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end"></div>
        <div id="palSw" style="height:16px;border-radius:4px;margin:10px 0"></div>
        <div style="display:flex;gap:8px"><button id="palAdd" data-t="addColor"></button><span style="flex:1"></span><button id="palCancel" data-t="cancel"></button><button id="palSave" class="primary" data-t="savePal"></button></div>
      </div>

      <div class="card" data-tab="info">
        <p class="lbl" data-t="info"></p>
        <div class="row" id="info" style="font-size:12px;color:var(--muted)"></div>
        <div style="display:flex;gap:8px;margin-top:10px">
          <button id="identify" data-t="identify"></button>
          <button id="resetDeck" data-t="resetDeck"></button>
          <button id="copyInfo" data-t="copyInfo"></button>
        </div>
      </div>

      <!-- PRUEBAS: numerar pantallas (borrar luego) -->
      <div class="card" data-tab="debug" style="border-style:dashed">
        <p class="lbl">Debug · numerar pantallas</p>
        <div style="display:flex;flex-wrap:wrap;gap:8px">
          <button id="dbgNumber">Poner números</button>
          <button id="dbgClear">Quitar números</button>
          <button id="dbgRestore">Volver a mis iconos</button>
        </div>
        <p style="font-size:12px;color:var(--muted);margin:8px 0 0">Grande: orden en que se pintan. Abajo: OD = posición en OpenDeck, HW = índice real en el deck.</p>
        <div id="dbgTable" style="font:12px/1.6 ui-monospace,Consolas,monospace;color:var(--muted);margin-top:8px;white-space:pre"></div>
      </div>
      <!-- /PRUEBAS -->

      <div style="display:flex;gap:8px;align-items:center">
        <span id="msg" class="msg" style="flex:1"></span>
        <button id="close" data-t="close"></button>
        <button id="save" class="primary" data-t="save"></button>
      </div>
    </div>
  </div>
</div>

<script>
const TXT = {
  es: {
    screen: 'Pantalla', brightness: 'Brillo', neverSleep: 'No apagar nunca la pantalla', sleepAfter: 'Apagar la pantalla tras',
    swallow: 'La pulsación que la enciende no ejecuta la acción', briNote: 'Con el horario de día y noche activo, el brillo lo marca el horario.',

    animNote: 'El cierre se ve al cerrar OpenDeck. Al apagar el PC puede no dar tiempo. Guarda para que se usen al arrancar y al cerrar.',
    noGif: 'Elige primero un GIF', trail: 'Estela', reverse: 'Invertir (de abajo arriba y de derecha a izquierda)', fixed: 'Fijo', tScreen: 'Pantalla', tBg: 'Fondo', tIcons: 'Iconos', tAnims: 'Animaciones', tInfo: 'Información', cal: 'Calibración de iconos', calKeys: 'Teclas', calSide: 'Iconos laterales', calStrip: 'Pantalla de las ruedas', calX: 'Horizontal', calY: 'Vertical', calSize: 'Tamaño', calTest: 'Poner imagen de prueba', calReset: 'Restablecer', calStop: 'Volver a mis iconos', calOn: 'Imagen de prueba en el deck', calNote: 'Pon la imagen de prueba: sale solo en la zona elegida y el resto se queda en negro. Mueve los ajustes mirando el deck hasta que se vean los 7 anillos enteros, con el mismo grosor por los cuatro lados, y los 4 cuadraditos blancos de las esquinas. Guarda para aplicarlo a todos tus iconos.', oneNote: 'En este deck solo están las animaciones por pasos. Para que vaya fluido se cambian como mucho 4 teclas a la vez: si un paso necesita más (por ejemplo con estela), se reparte en varios envíos. Al cerrar siempre deja la imagen de fondo.', gifSaved: 'GIF guardado', playing: 'Reproduciendo…',
   
   
    newPal: 'Nueva paleta', name: 'Nombre', addColor: 'Añadir color', cancel: 'Cancelar', savePal: 'Guardar paleta', needName: 'Ponle un nombre', delPal: '¿Borrar la paleta',
    empty: 'No hay ningún deck conectado. Conéctalo y vuelve a abrir los ajustes.', polar: 'Hoy no amanece o no anochece en esa latitud',
    unsaved: 'Hay cambios sin guardar. ¿Cerrar igualmente?', connected: 'Conectado',
    bg: 'Fondo del deck', bgSrcImage: 'Imagen', bgSrcColor: 'Color plano', bgPick: 'Elegir imagen…', bgCover: 'Rellenar', bgContain: 'Encajar', bgColor: 'Color', bgFill: 'Color de los bordes', bgNoImage: 'Elige una imagen o usa un color plano',

function update() {
  const s = draft, sc = s.schedule;

  $('briNote').classList.toggle('hidden', !sc.enabled);

  $('sunBox').classList.toggle('hidden', sc.mode !== 'sun'); $('fixBox').classList.toggle('hidden', sc.mode !== 'fixed');
  $('dayBriV').textContent = sc.day_brightness + ' %'; $('nightBriV').textContent = sc.night_brightness + ' %';

function windowMinutes() {
  const sc = draft.schedule;
  if (sc.mode === 'sun' && sun && !sun.error) {
    const r = toMin(sun.sunrise) + (+sc.offset_minutes || 0), s = toMin(sun.sunset) + (+sc.offset_minutes || 0);
    if (r < s) return [r, s];
  }
  return [toMin(sc.day_start) ?? 450, toMin(sc.night_start) ?? 1260];
}

// Mismo cálculo que el plugin (schedule.rs)
function levelAt(m) {
  const sc = draft.schedule, [day, night] = windowMinutes(), tr = +sc.transition_minutes || 0;
  const d = +sc.day_brightness, n = +sc.night_brightness, lerp = (a, b, x) => Math.round(a + (b - a) * Math.min(1, Math.max(0, x)));
  if (tr > 0 && m >= day && m < day + tr) return [lerp(n, d, (m - day) / tr), true];
  if (m >= day && m < night) return [d, true];
  if (tr > 0 && m >= night && m < night + tr) return [lerp(d, n, (m - night) / tr), false];
  return [n, false];
}

function drawBar() {
  let h = '';
  for (let m = 0; m < 1440; m += 15) {
    const [v, isDay] = levelAt(m);
    h += `<div style="position:absolute;left:${m / 14.4}%;width:1.3%;bottom:0;height:${Math.max(6, v)}%;background:${isDay ? 'var(--day)' : 'var(--night)'}"></div>`;
  }
  const now = new Date(), nm = now.getHours() * 60 + now.getMinutes();
  h += `<div style="position:absolute;left:${nm / 14.4}%;top:0;bottom:0;width:2px;background:var(--text);opacity:.6"></div>`;
  $('bar').innerHTML = h;
}

async function refreshSun() {
  const sc = draft.schedule;
  try {
    sun = await api(`/api/sun?lat=${encodeURIComponent(sc.lat)}&lon=${encodeURIComponent(sc.lon)}`);
    $('sunrise').textContent = sun.error ? '—' : sun.sunrise; $('sunset').textContent = sun.error ? '—' : sun.sunset;
    if (sun.error) msg(t.polar, 'err');
  } catch (_) { sun = null; }
  drawBar();
}

let bgImg = null, bgFit = 'cover', bgSrc = 'image';

function drawBackground() {
  const c = $('bgCanvas'), x = c.getContext('2d'), W = c.width, H = c.height;
  const useImage = bgSrc === 'image';
  // Imagen: el color solo se ve en los bordes al encajar. Color plano: solo el color.
  x.fillStyle = useImage && !bgImg ? '#000000' : $('bgColor').value; x.fillRect(0, 0, W, H);
  if (useImage && bgImg) {
    const k = (bgFit === 'cover' ? Math.max : Math.min)(W / bgImg.width, H / bgImg.height);
    const w = bgImg.width * k, h = bgImg.height * k;
    x.imageSmoothingQuality = 'high';
    x.drawImage(bgImg, (W - w) / 2, (H - h) / 2, w, h);
  }
  document.querySelectorAll('[data-src]').forEach((b) => b.classList.toggle('on', b.dataset.src === bgSrc));
  document.querySelectorAll('[data-fit]').forEach((b) => b.classList.toggle('on', b.dataset.fit === bgFit));
  $('bgImageOpts').classList.toggle('hidden', !useImage);
  $('bgColorBox').classList.toggle('hidden', useImage && bgFit !== 'contain');
  $('bgColorLbl').textContent = useImage ? t.bgFill : t.bgColor;
  $('bgApply').disabled = useImage && !bgImg;
  $('bgApply').title = $('bgApply').disabled ? t.bgNoImage : '';
}

function loadImage(src) {
  return new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = src; });
}

async function loadBackground() {

  return a.map((v, j) => Math.round(v + (b[j] - v) * k));
}

  document.querySelectorAll('[data-kind]').forEach((box) => {
    box.innerHTML = `<select>${kinds.map((k) => `<option value="${k}">${t[KLBL[k]]}</option>`).join('')}</select>`;
    box.querySelector('select').onchange = (e) => { draft.animations[box.dataset.kind].kind = e.target.value; updateAnims(); };
  });
}
const anims = () => draft.animations;
function animColors(cols, pal, rnd = false) { for (const w of ['startup', 'shutdown']) { anims()[w].colors = cols.slice(); anims()[w].palette = pal; anims()[w].random_colors = rnd; } }
function fillAnims() {
  const a = anims(), kinds = current.anim_kinds || [];
  renderKinds();
  $('oneNote').classList.toggle('hidden', !(kinds.length && !kinds.includes('wave')));
  $('animDur').value = a.startup.duration_ms / 1000; $('endWith').value = a.end_with_background ? 'bg' : 'off';
  $('animOne').value = a.startup.colors[0] || '#2f7de1';
  updateAnims();
}
function updateAnims() {
  const a = anims(), isRnd = !!a.startup.random_colors, isOne = !isRnd && a.startup.palette === '';
  for (const w of ['startup', 'shutdown']) {
    const sel = document.querySelector(`[data-kind=${w}] select`); if (sel) sel.value = a[w].kind;
    const box = document.querySelector(`[data-gif=${w}]`), img = box.querySelector('img');
    box.classList.toggle('hidden', a[w].kind !== 'gif');
    const has = current.gifs && current.gifs[w];
    img.classList.toggle('hidden', !has);
    if (has && img.dataset.for !== current.id + w + current.gifs[w]) { img.src = `/api/animation/gif?id=${encodeURIComponent(current.id)}&which=${w}&t=${Date.now()}`; img.dataset.for = current.id + w + current.gifs[w]; }
    document.querySelector(`[data-test=${w}]`).disabled = a[w].kind === 'none';
  }
  $('animDurV').textContent = (+$('animDur').value).toFixed(1).replace('.', ',') + ' s';
  // La estela solo cuenta en las animaciones de pasos
  const trailed = ['chase', 'arrow', 'random', 'snake', 'bounce', 'meet', 'rain', 'windmill', 'cross', 'swing'].some((k) => a.startup.kind === k || a.shutdown.kind === k);
  $('animRev').checked = !!a.startup.reverse;
  [$('animRev').closest('span'), $('animRev').closest('.row').querySelector('[data-t=reverse]')].forEach((e) => e.classList.toggle('hidden', !trailed));
  const fixed = !!a.startup.fixed, tr = Math.min(3, Math.max(0, a.startup.trail ?? 3));
  document.querySelectorAll('#animTrail button').forEach((b) => b.classList.toggle('on', fixed ? b.dataset.tr === 'fixed' : b.dataset.tr === String(tr)));
  $('animRev').onchange = (e) => { for (const w of ['startup', 'shutdown']) anims()[w].reverse = e.target.checked; updateAnims(); };
  [$('animTrail').closest('span'), $('animTrail').closest('.row').querySelector('[data-t=trail]')].forEach((e) => e.classList.toggle('hidden', !trailed));
  // Los colores solo cuentan en ola, tecla a tecla y fundido
  const colorful = ['chase', 'arrow', 'random', 'snake', 'bounce', 'meet', 'rain', 'windmill', 'cross', 'swing', 'wave', 'keys', 'fade'].some((k) => a.startup.kind === k || a.shutdown.kind === k);
  $('colorsBox').classList.toggle('hidden', !colorful);
  const onlyOne = (current.anim_kinds || []).length && !(current.anim_kinds || []).includes('wave');
  $('endWith').closest('.row').querySelectorAll('[data-t=endWith], #endWith').forEach((e) => e.classList.toggle('hidden', onlyOne));
  const cm = isRnd ? 'rnd' : isOne ? 'one' : 'pal';
  document.querySelectorAll('#animCm button').forEach((b) => b.classList.toggle('on', b.dataset.cm === cm));
  $('animOne').classList.toggle('hidden', cm !== 'one'); $('animPal').classList.toggle('hidden', cm !== 'pal');
  palGrid($('animPal'), () => anims().startup.palette, (n, c) => { animColors(c, n); });
}
document.querySelectorAll('#animTrail button').forEach((b) => b.onclick = () => {
  for (const w of ['startup', 'shutdown']) {
    const x = anims()[w];
    if (b.dataset.tr === 'fixed') x.fixed = true; else { x.fixed = false; x.trail = +b.dataset.tr; }
  }
  updateAnims();
});
$('animDur').oninput = (e) => { anims().startup.duration_ms = anims().shutdown.duration_ms = Math.round(+e.target.value * 1000); updateAnims(); };
$('endWith').onchange = (e) => { anims().end_with_background = e.target.value === 'bg'; };
$('animOne').oninput = (e) => animColors([e.target.value], '');
document.querySelectorAll('#animCm button').forEach((b) => b.onclick = () => {
  if (b.dataset.cm === 'one') animColors([$('animOne').value], '');
  else if (b.dataset.cm === 'rnd') animColors(BUILTIN[0][1], '', true);
  else { const p = BUILTIN[0]; animColors(p[1], p[0]); }
  updateAnims();
});
document.querySelectorAll('[data-gif] button').forEach((b) => b.onclick = () => { gifWhich = b.closest('[data-gif]').dataset.gif; $('gifFile').click(); });
$('gifFile').onchange = (e) => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const r = new FileReader();
  r.onload = async () => {
    try {
      const res = await api('/api/animation/gif', { id: current.id, which: gifWhich, data: r.result });
      if (res.error) throw new Error(res.error);
      current.gifs = current.gifs || {}; current.gifs[gifWhich] = Date.now(); msg(t.gifSaved, 'ok'); updateAnims();
    } catch (err) { msg(err.message, 'err'); }
  };
  r.readAsDataURL(f);
};
document.querySelectorAll('[data-test]').forEach((b) => b.onclick = async () => {
  const w = b.dataset.test, a = anims()[w];
  if (a.kind === 'gif' && !(current.gifs && current.gifs[w])) { msg(t.noGif, 'err'); return; }
  b.disabled = true; msg(t.playing, 'wait');
  try { const r = await api('/api/animation/test', { id: current.id, closing: w === 'shutdown', animation: a }); if (r.error) throw new Error(r.error); msg(''); }
  catch (e) { msg(e.message, 'err'); }
  b.disabled = false;
});

function redrawPals() { if (draft) updateAnims(); }

// ------------------------------------------------------------------ info --
$('resetDeck').onclick = () => api('/api/reset', { id: current.id }).catch((e) => msg(e.message, 'err'));
$('copyInfo').onclick = async () => {
  const text = infoList().map(([a, b]) => `${a}: ${b}`).join('\n');
  try { await navigator.clipboard.writeText(text); msg(t.copied, 'ok'); } catch (_) { msg(text); }
};

// ----------------------------------------------------------- calibración --
let calZone = 'keys', calOn = false, calBusy = false, calPending = false;
const CAL0 = { dx: 0, dy: 0, size: 100 };
const ZLBL = { keys: 'calKeys', side: 'calSide', strip: 'calStrip' };
const calZones = () => current.cal_zones || [];
const calSize = () => (calZones().find(([z]) => z === calZone) || ['keys', [85, 85]])[1];
const calAdj = () => {
  const c = draft.calibration = draft.calibration || {};
  for (const [z] of calZones()) c[z] = c[z] || { ...CAL0 };
  return c[calZone] || (c[calZone] = { ...CAL0 });
};
function calPattern(w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'), u = Math.min(w, h) / 85, r = Math.max(1, Math.round(3 * u));
  ['#ff2020', '#ff8a00', '#ffe600', '#20d040', '#00c8ff', '#3050ff', '#a040ff'].forEach((col, i) => { x.fillStyle = col; x.fillRect(i * r, i * r, w - i * 2 * r, h - i * 2 * r); });
  x.fillStyle = '#000'; x.fillRect(7 * r, 7 * r, w - 14 * r, h - 14 * r); x.fillStyle = '#0c1440'; x.fillRect(8 * r, 8 * r, w - 16 * r, h - 16 * r);
  const cx = w / 2, top = h / 2 - 12 * u;
  x.fillStyle = '#fff'; x.beginPath(); x.moveTo(cx, top); x.lineTo(cx + 8 * u, top + 16 * u); x.lineTo(cx - 8 * u, top + 16 * u); x.fill();
  x.fillRect(cx - 6 * u, h / 2 + 6 * u, 12 * u, 4 * u);
  for (const [px, py] of [[0, 0], [w - 5 * u, 0], [0, h - 5 * u], [w - 5 * u, h - 5 * u]]) x.fillRect(px, py, 5 * u, 5 * u);
  return c;
}
function drawCal() {
  const [w, h] = calSize(), a = calAdj(), cv = $('calCv'), k = 120 / Math.max(w, h);
  cv.width = Math.round(w * k); cv.height = Math.round(h * k); cv.style.width = cv.width + 'px'; cv.style.height = cv.height + 'px';
  const x = cv.getContext('2d'), s = a.size / 100;
  x.fillStyle = '#000'; x.fillRect(0, 0, cv.width, cv.height);
  x.drawImage(calPattern(w, h), ((w - w * s) / 2 + a.dx) * k, ((h - h * s) / 2 + a.dy) * k, w * s * k, h * s * k);
}
function fillCal() {
  const zs = calZones();
  $('calCard').classList.toggle('hidden', !zs.length);
  if (!zs.length) return;
  if (!zs.some(([z]) => z === calZone)) calZone = zs[0][0];
  $('calZone').innerHTML = zs.map(([z]) => `<button data-z="${z}" class="${z === calZone ? 'on' : ''}">${t[ZLBL[z]] || z}</button>`).join('');
  $('calZone').querySelectorAll('button').forEach((b) => b.onclick = () => { calZone = b.dataset.z; fillCal(); sendCal(calZone); });
  const a = calAdj();
  $('calX').value = a.dx; $('calY').value = a.dy; $('calS').value = a.size;
  $('calXV').textContent = a.dx + ' px'; $('calYV').textContent = a.dy + ' px'; $('calSV').textContent = a.size + ' %';
  $('calState').textContent = calOn ? t.calOn : ''; $('calStop').disabled = !calOn;
  drawCal();
}
// Manda al deck solo el último cambio, y no hasta que termine el anterior
async function sendCal(zone) {
  if (!calOn) return;
  if (calBusy) { calPending = true; return; }
  calBusy = true;
  try { const r = await api('/api/calibration/test', { id: current.id, calibration: draft.calibration, zone }); if (r.error) throw new Error(r.error); }
  catch (e) { msg(e.message, 'err'); }
  calBusy = false;
  if (calPending) { calPending = false; sendCal(calZone); }
}
async function stopCal() {
  if (!calOn) return;
  calOn = false; fillCal();
  try { await api('/api/calibration/stop', { id: current.id }); } catch (_) {}
}
[['calX', 'dx'], ['calY', 'dy'], ['calS', 'size']].forEach(([el, key]) => $(el).oninput = (e) => { calAdj()[key] = +e.target.value; fillCal(); sendCal(calZone); });
// Botones − / +: un paso por clic; si se mantiene pulsado, repite
document.querySelectorAll('[data-step]').forEach((b) => {
  let timer = null;
  const step = () => {
    const el = $(b.dataset.step), v = Math.min(+el.max, Math.max(+el.min, +el.value + +b.dataset.d));
    if (v === +el.value) return;
    el.value = v; el.dispatchEvent(new Event('input'));
  };
  const stop = () => { clearTimeout(timer); clearInterval(timer); timer = null; };
  b.addEventListener('pointerdown', (e) => { e.preventDefault(); step(); timer = setTimeout(() => { timer = setInterval(step, 120); }, 400); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => b.addEventListener(ev, stop));
  b.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); step(); } });
});
$('calReset').onclick = () => { draft.calibration[calZone] = { ...CAL0 }; calAdj(); fillCal(); sendCal(calZone); };
$('calTest').onclick = () => { calAdj(); calOn = true; fillCal(); sendCal(calZone); };
$('calStop').onclick = stopCal;
window.addEventListener('pagehide', () => { if (calOn) navigator.sendBeacon('/api/calibration/stop', new Blob([JSON.stringify({ id: current.id })], { type: 'application/json' })); });
