<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MGDC · Ajustes</title>
<style>
  :root {
    --bg: #f4f3ef; --card: #ffffff; --soft: #f1efe8; --text: #1f1e1c; --muted: #6b6a65; --faint: #9a988f;
    --border: rgba(0,0,0,.12); --accent: #2f7de1; --accent-bg: #e6f1fb; --accent-tx: #185fa5;
    --ok: #3b6d11; --danger: #c43a3a; --day: rgba(239,159,39,.85); --night: rgba(55,138,221,.85);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161616; --card: #202020; --soft: #2a2a2a; --text: #ececec; --muted: #a3a3a3; --faint: #777;
      --border: rgba(255,255,255,.12); --accent: #5aa2ff; --accent-bg: #0c2c4f; --accent-tx: #b5d4f4;
      --ok: #97c459; --danger: #ff7b7b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 "Segoe UI", system-ui, sans-serif; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
  .lbl { font-size: 12px; color: var(--muted); margin: 0 0 8px; }
  input, button, select { font: inherit; color: var(--text); }
  input[type=text], input[type=number], input[type=time] { height: 32px; padding: 0 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); }
  input[type=number] { width: 76px; }
  input[type=range] { width: 170px; accent-color: var(--accent); }
  input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); }
  button { font-size: 13px; padding: 6px 12px; border: 1px solid var(--border); border-radius: 8px; background: transparent; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  button:hover { background: var(--soft); }
  button.primary { border-color: var(--accent); color: var(--accent); }
  .layout { display: grid; grid-template-columns: 200px minmax(0,1fr); gap: 12px; margin-top: 12px; }
  .dev { display: flex; flex-direction: column; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; background: var(--card); text-align: left; width: 100%; margin-bottom: 6px; }
  .dev.on { border-color: var(--accent); background: var(--accent-bg); }
  .dev small { font-size: 11px; color: var(--ok); }
  .row { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 10px 12px; align-items: center; font-size: 13px; }
  .off { color: var(--faint); }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; font-size: 12px; padding: 6px 12px; }
  .seg button.on { background: var(--accent-bg); color: var(--accent-tx); }
  .sl { display: flex; align-items: center; gap: 8px; }
  .sl span { min-width: 40px; text-align: right; }
  .tiles { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; margin: 8px 0 12px; }
  .tile { background: var(--soft); border-radius: 8px; padding: 10px; }
  .tile .k { font-size: 12px; color: var(--muted); }
  .tile .v { font-size: 20px; font-weight: 600; }
  #bar { position: relative; height: 32px; border-radius: 6px; overflow: hidden; background: var(--soft); margin-top: 14px; }
  .ticks { display: flex; justify-content: space-between; font-size: 11px; color: var(--faint); margin-top: 4px; }
  .msg { font-size: 13px; }
  .msg.ok { color: var(--ok); } .msg.err { color: var(--danger); }
  .hidden { display: none !important; }
  .empty { padding: 40px 16px; text-align: center; color: var(--muted); }
  #bgCanvas { width: 100%; height: auto; display: block; border-radius: 8px; border: 1px solid var(--border); background: #000; }
  .bgbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
  input[type=color] { width: 36px; height: 30px; padding: 0 2px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); }
  select { height: 32px; padding: 0 6px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); }
  button:disabled { opacity: .5; cursor: default; }
  .pl { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px; }
  .pc { position: relative; display: block; border: 1px solid var(--border); border-radius: 8px; padding: 5px 6px; font-size: 12px; text-align: left; background: var(--card); }
  .pc.on { border: 2px solid var(--accent); padding: 4px 5px; }
  .pc .sw { height: 14px; border-radius: 4px; margin-bottom: 3px; }
  .pc .del { position: absolute; top: 2px; right: 2px; border: 0; padding: 0 4px; font-size: 11px; color: var(--muted); }
  .ed { margin-top: 10px; padding: 10px; border: 1px dashed var(--border); border-radius: 8px; }
  .arow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 13px; }
  .arow > span:first-child { width: 58px; }
  [data-kind] button { padding: 6px 9px; }
  .arow [data-test] { margin-left: auto; }
  .knobs { display: flex; gap: 12px; align-items: center; margin-top: 12px; }
  .kn { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--border); }
  .thumb { height: 30px; border-radius: 4px; border: 1px solid var(--border); }
</style>
</head>
<body>
<div class="wrap">
  <div style="display:flex;align-items:center;gap:8px">
    <strong style="font-size:16px;flex:1" id="title">MGDC · Mars Gaming Deck Controller</strong>
    <span style="font-size:12px;color:var(--muted)" id="version"></span>
  </div>

  <div id="empty" class="card empty hidden" style="margin-top:12px"></div>

  <div class="layout hidden" id="main">
    <div id="devices"></div>

    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="card">
        <p class="lbl" data-t="screen"></p>
        <div class="row">
          <span data-t="brightness"></span>
          <span class="sl"><input type="range" id="brightness" min="0" max="100" step="1"><span id="brightnessV"></span></span>
          <span data-t="neverSleep"></span>
          <span><input type="checkbox" id="neverSleep"></span>
          <span id="sleepLbl" data-t="sleepAfter"></span>
          <span><input type="number" id="sleepMinutes" min="1" max="240" step="1"> min</span>
          <span data-t="swallow"></span>
          <span><input type="checkbox" id="swallow"></span>
        </div>
        <p id="briNote" class="hidden" style="font-size:12px;color:var(--muted);margin:8px 0 0" data-t="briNote"></p>
      </div>

      <div class="card">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
          <p class="lbl" style="margin:0;flex:1" data-t="dayNight"></p>
          <label style="font-size:13px;display:flex;align-items:center;gap:6px"><input type="checkbox" id="schedEnabled"><span data-t="enabled"></span></label>
        </div>
        <div id="schedBody">
          <div class="seg" style="margin-bottom:12px">
            <button data-mode="sun" data-t="modeSun"></button>
            <button data-mode="fixed" data-t="modeFixed"></button>
          </div>

          <div id="sunBox">
            <div style="display:flex;gap:8px;flex-wrap:wrap">
              <input type="text" id="city" list="cities" style="flex:1;min-width:160px" data-tp="cityPh">
              <datalist id="cities"></datalist>
              <input type="number" id="lat" step="0.0001" min="-90" max="90" title="Latitud" style="width:104px">
              <input type="number" id="lon" step="0.0001" min="-180" max="180" title="Longitud" style="width:104px">
            </div>
            <div class="tiles">
              <div class="tile"><div class="k" data-t="sunrise"></div><div class="v" id="sunrise">--:--</div></div>
              <div class="tile"><div class="k" data-t="sunset"></div><div class="v" id="sunset">--:--</div></div>
            </div>
            <div class="row" style="margin-bottom:10px">
              <span data-t="offset"></span>
              <span><input type="number" id="offset" step="5" min="-180" max="180"> min</span>
            </div>
          </div>

          <div id="fixBox" class="row" style="margin-bottom:10px">
            <span data-t="dayStart"></span><span><input type="time" id="dayStart"></span>
            <span data-t="nightStart"></span><span><input type="time" id="nightStart"></span>
          </div>

          <div class="row">
            <span data-t="dayBri"></span>
            <span class="sl"><input type="range" id="dayBri" min="0" max="100" step="5"><span id="dayBriV"></span></span>
            <span data-t="nightBri"></span>
            <span class="sl"><input type="range" id="nightBri" min="0" max="100" step="5"><span id="nightBriV"></span></span>
            <span data-t="transition"></span>
            <span><input type="number" id="transition" min="0" max="120" step="5"> min</span>
          </div>
          <div id="bar"></div>
          <div class="ticks"><span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>24:00</span></div>
        </div>
        <p id="schedOff" style="font-size:13px;color:var(--faint);margin:0" data-t="schedOff"></p>
      </div>

      <div class="card">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
          <p class="lbl" style="margin:0;flex:1" data-t="bg"></p>
          <span id="bgSize" style="font-size:12px;color:var(--faint)"></span>
        </div>
        <canvas id="bgCanvas" width="854" height="480"></canvas>
        <div class="bgbar">
          <div class="seg">
            <button data-src="image" data-t="bgSrcImage"></button>
            <button data-src="color" data-t="bgSrcColor"></button>
          </div>
          <span id="bgImageOpts" style="display:contents">
            <button id="bgPick" data-t="bgPick"></button>
            <input type="file" id="bgFile" accept="image/*" class="hidden">
            <div class="seg">
              <button data-fit="cover" data-t="bgCover"></button>
              <button data-fit="contain" data-t="bgContain"></button>
            </div>
          </span>
          <label id="bgColorBox" style="display:flex;align-items:center;gap:6px;font-size:13px"><span id="bgColorLbl"></span><input type="color" id="bgColor" value="#000000"></label>
        </div>
        <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px;font-size:13px">
          <span data-t="bgFix"></span>
          <select id="bgFix">
            <option value="none" data-t="fixNone"></option>
            <option value="mirror" data-t="fixMirror"></option>
            <option value="flip" data-t="fixFlip"></option>
            <option value="rotate" data-t="fixRotate"></option>
          </select>
          <span style="flex:1"></span>
          <button id="bgApply" class="primary" data-t="bgApply"></button>
        </div>
        <p style="font-size:12px;color:var(--muted);margin:8px 0 0" data-t="bgNote"></p>
      </div>

      <div class="card">
        <p class="lbl" data-t="anims"></p>
        <div class="arow">
          <span data-t="startup"></span>
          <div class="seg" data-kind="startup"></div>
          <span class="gifbox" data-gif="startup" style="display:flex;gap:6px;align-items:center"><button data-t="pickGif"></button><img class="thumb hidden" alt=""></span>
          <button data-test="startup" data-t="test"></button>
        </div>
        <div class="arow">
          <span data-t="shutdown"></span>
          <div class="seg" data-kind="shutdown"></div>
          <span class="gifbox" data-gif="shutdown" style="display:flex;gap:6px;align-items:center"><button data-t="pickGif"></button><img class="thumb hidden" alt=""></span>
          <button data-test="shutdown" data-t="test"></button>
        </div>
        <input type="file" id="gifFile" accept="image/gif" class="hidden">
        <div class="row" style="margin-bottom:10px">
          <span data-t="duration"></span>
          <span class="sl"><input type="range" id="animDur" min="0.5" max="4" step="0.5"><span id="animDurV"></span></span>
          <span data-t="endWith"></span>
          <select id="endWith"><option value="bg" data-t="endBg"></option><option value="off" data-t="endOff"></option></select>
        </div>
        <div class="arow" style="margin-bottom:8px">
          <span data-t="colors"></span>
          <div class="seg" id="animCm"><button data-cm="one" data-t="oneColor"></button><button data-cm="pal" data-t="palette"></button></div>
          <input type="color" id="animOne">
        </div>
        <div class="pl" id="animPal"></div>
        <p style="font-size:12px;color:var(--muted);margin:10px 0 0" data-t="animNote"></p>
      </div>

      <div class="card" id="ledCard">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
          <p class="lbl" style="margin:0;flex:1" data-t="leds"></p>
          <span id="ledState" style="font-size:12px;color:var(--faint)"></span>
        </div>
        <div class="seg" id="ledMode" style="margin-bottom:12px">
          <button data-lm="off" data-t="ledOff"></button><button data-lm="one" data-t="oneColor"></button><button data-lm="each" data-t="ledEach"></button><button data-lm="breath" data-t="ledBreath"></button><button data-lm="palette" data-t="palette"></button>
        </div>
        <div class="row">
          <span id="ledColLbl" data-t="colors"></span>
          <span id="ledCols" style="display:flex;gap:6px"></span>
          <span data-t="brightness"></span>
          <span class="sl"><input type="range" id="ledBri" min="0" max="100" step="5"><span id="ledBriV"></span></span>
          <span data-t="ledFlash"></span><span><input type="checkbox" id="ledFlash"></span>
          <span data-t="ledFollow"></span><span><input type="checkbox" id="ledFollow"></span>
        </div>
        <div class="pl" id="ledPal" style="margin-top:10px"></div>
        <div class="knobs"><span style="font-size:12px;color:var(--muted)" data-t="preview"></span><div class="kn"></div><div class="kn"></div><div class="kn"></div><div class="kn"></div></div>
      </div>

      <div class="ed hidden" id="palEd">
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;font-size:13px">
          <span data-t="name"></span><input type="text" id="palName" style="width:160px">
          <span style="flex:1"></span><span id="palErr" class="msg err"></span>
        </div>
        <div id="palStops" style="display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end"></div>
        <div id="palSw" style="height:16px;border-radius:4px;margin:10px 0"></div>
        <div style="display:flex;gap:8px"><button id="palAdd" data-t="addColor"></button><span style="flex:1"></span><button id="palCancel" data-t="cancel"></button><button id="palSave" class="primary" data-t="savePal"></button></div>
      </div>

      <div class="card">
        <p class="lbl" data-t="info"></p>
        <div class="row" id="info" style="font-size:12px;color:var(--muted)"></div>
        <div style="display:flex;gap:8px;margin-top:10px">
          <button id="identify" data-t="identify"></button>
          <button id="resetDeck" data-t="resetDeck"></button>
          <button id="copyInfo" data-t="copyInfo"></button>
        </div>
      </div>

      <div style="display:flex;gap:8px;align-items:center">
        <span id="msg" class="msg" style="flex:1"></span>
        <button id="close" data-t="close"></button>
        <button id="save" class="primary" data-t="save"></button>
      </div>
    </div>
  </div>
</div>

const CITIES = [

  ['Alicante', 38.3452, -0.4810], ['Córdoba', 37.8882, -4.7794], ['Valladolid', 41.6523, -4.7245], ['Vigo', 42.2406, -8.7207],

function windowMinutes() {
  const sc = draft.schedule;
  if (sc.mode === 'sun' && sun && !sun.error) {
    const r = toMin(sun.sunrise) + (+sc.offset_minutes || 0), s = toMin(sun.sunset) + (+sc.offset_minutes || 0);
    if (r < s) return [r, s];
  }
  return [toMin(sc.day_start) ?? 450, toMin(sc.night_start) ?? 1260];
}

// Mismo cálculo que el plugin (schedule.rs)
function levelAt(m) {
  const sc = draft.schedule, [day, night] = windowMinutes(), tr = +sc.transition_minutes || 0;
  const d = +sc.day_brightness, n = +sc.night_brightness, lerp = (a, b, x) => Math.round(a + (b - a) * Math.min(1, Math.max(0, x)));
  if (tr > 0 && m >= day && m < day + tr) return [lerp(n, d, (m - day) / tr), true];
  if (m >= day && m < night) return [d, true];
  if (tr > 0 && m >= night && m < night + tr) return [lerp(d, n, (m - night) / tr), false];
  return [n, false];
}

function drawBar() {
  let h = '';
  for (let m = 0; m < 1440; m += 15) {
    const [v, isDay] = levelAt(m);
    h += `<div style="position:absolute;left:${m / 14.4}%;width:1.3%;bottom:0;height:${Math.max(6, v)}%;background:${isDay ? 'var(--day)' : 'var(--night)'}"></div>`;
  }
  const now = new Date(), nm = now.getHours() * 60 + now.getMinutes();
  h += `<div style="position:absolute;left:${nm / 14.4}%;top:0;bottom:0;width:2px;background:var(--text);opacity:.6"></div>`;
  $('bar').innerHTML = h;
}

async function refreshSun() {

    if (sun.error) msg(t.polar, 'err');

  drawBar();
}

let bgImg = null, bgFit = 'cover', bgSrc = 'image';

function drawBackground() {
  const c = $('bgCanvas'), x = c.getContext('2d'), W = c.width, H = c.height;
  const useImage = bgSrc === 'image';
  // Imagen: el color solo se ve en los bordes al encajar. Color plano: solo el color.
  x.fillStyle = useImage && !bgImg ? '#000000' : $('bgColor').value; x.fillRect(0, 0, W, H);
  if (useImage && bgImg) {
    const k = (bgFit === 'cover' ? Math.max : Math.min)(W / bgImg.width, H / bgImg.height);
    const w = bgImg.width * k, h = bgImg.height * k;
    x.imageSmoothingQuality = 'high';
    x.drawImage(bgImg, (W - w) / 2, (H - h) / 2, w, h);
  }
  document.querySelectorAll('[data-src]').forEach((b) => b.classList.toggle('on', b.dataset.src === bgSrc));

  $('bgApply').disabled = useImage && !bgImg;

    let c;
    if (l.mode === 'off') c = [0, 0, 0];
    else if (l.mode === 'one') c = hexRgb(l.colors[0]);
    else if (l.mode === 'each') c = hexRgb(l.colors[i] || l.colors[0]);
    else if (l.mode === 'breath') c = hexRgb(l.colors[0]).map((v) => v * (0.15 + 0.85 * (Math.sin(ledT * 2 * Math.PI / 3) + 1) / 2));
    else c = samplePal(l.palette_colors, ledT * 0.15 + i / 4);
    k.style.background = l.mode === 'off' ? 'transparent' : `rgb(${c.map((v) => Math.round(v * b)).join(',')})`;
  });
}, 50);

function redrawPals() { if (draft) { updateAnims(); updateLeds(); } }

// ------------------------------------------------------------------ info --
$('resetDeck').onclick = () => api('/api/reset', { id: current.id }).catch((e) => msg(e.message, 'err'));
$('copyInfo').onclick = async () => {
  const text = infoList().map(([a, b]) => `${a}: ${b}`).join('\n');
  try { await navigator.clipboard.writeText(text); msg(t.copied, 'ok'); } catch (_) { msg(text); }
};

$('identify').onclick = () => api('/api/identify', { id: current.id }).catch((e) => msg(e.message, 'err'));
$('save').onclick = async () => {
  try {
    await api('/api/save', { id: current.id, settings: draft });
    current.settings = JSON.parse(JSON.stringify(draft)); saved = JSON.stringify(draft);
    msg(t.saved, 'ok');
  } catch (e) { msg(e.message, 'err'); }
};
$('close').onclick = () => { if (!dirty() || confirm(t.unsaved)) window.close(); };
setInterval(drawBar, 60000);

// ------------------------------------------------------------- arranque --
(async () => {
  try {
    const st = await api('/api/state');
    $('version').textContent = 'v' + st.version;
    devices = st.devices; custom = st.palettes || [];
    if (!devices.length) { $('empty').textContent = t.empty; $('empty').classList.remove('hidden'); return; }
    $('main').classList.remove('hidden');
    select(devices[0].id);
  } catch (e) {
    $('empty').textContent = e.message; $('empty').classList.remove('hidden');
  }
})();
</script>
