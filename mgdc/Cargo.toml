[package]
name = "mgdc"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0"
description = "MGDC (Mars Gaming Deck Controller): un solo plugin de OpenDeck para los decks MSD-ONE (familia AKP153) y MSD-PRO (familia AKP05 / N4)"
repository = "https://github.com/malzar/Mars-gaming-deck-tools"

[dependencies]
axum = "0.7"
chrono = "0.4"
data-url = "0.3.1"
dirs = "5"
env_logger = "0.11"
futures-lite = "2.6.0"
image = { version = "0.25.6", default-features = false, features = ["bmp", "jpeg"] }
log = "0.4.27"
mirajazz = "0.16.2"
openaction = "1.1.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.44.2", features = ["full"] }
tokio-util = { version = "0.7.15", features = ["full"] }
toml = "0.8"

# Versión de mirajazz de ambiso: añade LED y vibración para la familia N4 / AKP05.
# Mantiene la misma API que usan los dispositivos AKP153.
[patch.crates-io]
mirajazz = { git = "https://github.com/ambiso/mirajazz.git" }
# openaction 1.1.5 + evento "showSettingsInterface" (botón "Ajustes del plugin" de OpenDeck)
openaction = { path = "vendor/openaction" }

[profile.release]
strip = true
lto = true
