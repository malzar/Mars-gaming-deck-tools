<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Packs de iconos</title>
<style>
  :root {
    --bg: #f4f3ef; --surface: #ffffff; --surface-2: #f1efe8; --text: #1f1e1c; --muted: #6b6a65;
    --border: rgba(0,0,0,.12); --accent: #2f7de1; --ok-bg: #e3f2d9; --ok-tx: #2f5d0e;
    --danger: #c43a3a; --danger-bg: #fbe9e9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161616; --surface: #202020; --surface-2: #2a2a2a; --text: #ececec; --muted: #9b9b9b;
      --border: rgba(255,255,255,.12); --accent: #5aa2ff; --ok-bg: #233a14; --ok-tx: #a8d880;
      --danger: #ff7b7b; --danger-bg: #3a1c1c;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font: 14px/1.5 "Segoe UI", system-ui, sans-serif; }
  header, footer { display: flex; align-items: center; gap: 8px; padding: 12px 16px; background: var(--surface); }
  header { border-bottom: 1px solid var(--border); }
  footer { border-top: 1px solid var(--border); position: sticky; bottom: 0; }
  h1 { font-size: 15px; font-weight: 600; margin: 0; flex: 1; }
  .path { font: 12px Consolas, monospace; color: var(--muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sum { font-size: 13px; color: var(--muted); white-space: nowrap; }
  main { flex: 1; padding: 0 0 8px; }
  .palette { display: flex; height: 14px; border-radius: 4px; overflow: hidden; background: var(--surface-2); outline: 1px solid var(--border); }
  .palette span { height: 100%; min-width: 4px; }
  .row { display: grid; grid-template-columns: 28px 64px minmax(0,1fr) 110px 96px 36px; align-items: center; gap: 12px;
         padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--surface); }
  .row input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; margin: 0; }
  .row input[type=checkbox]:checked { cursor: default; }
  .thumbs { display: flex; gap: 3px; }
  .thumbs img, .thumbs span { width: 18px; height: 18px; border-radius: 4px; object-fit: cover; background: var(--surface-2); }
  .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .count { font-size: 12px; color: var(--muted); }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 6px; text-align: center; background: var(--surface-2); color: var(--muted); }
  .badge.ok { background: var(--ok-bg); color: var(--ok-tx); }
  .badge.busy { color: var(--accent); }
  button { font: inherit; font-size: 13px; color: var(--text); background: transparent; border: 1px solid var(--border);
           border-radius: 8px; padding: 6px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  button:hover { background: var(--surface-2); }
  .trash { width: 32px; height: 32px; padding: 0; justify-content: center; color: var(--danger); }
  .trash:hover { background: var(--danger-bg); }
  .trash[disabled] { color: var(--muted); border-color: transparent; cursor: default; background: transparent; opacity: .4; }
  .spacer { flex: 1; }
  .empty { padding: 48px 16px; text-align: center; color: var(--muted); }
  .empty b { display: block; color: var(--text); font-size: 15px; margin-bottom: 4px; }
  #msg { padding: 0 16px; font-size: 13px; min-height: 0; }
  #msg.err { color: var(--danger); padding: 8px 16px; }
  #msg.ok { color: var(--ok-tx); padding: 8px 16px; }
  svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<header>
  <svg viewBox="0 0 24 24" style="color:var(--accent)"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>
  <h1>Packs de iconos</h1>
  <span class="sum" id="sum"></span>
</header>
<header style="padding-top:8px;padding-bottom:8px">
  <svg viewBox="0 0 24 24" style="color:var(--muted)"><path d="M5 4h4l3 3h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2"/></svg>
  <span class="path" id="path"></span>
</header>
<div id="msg"></div>
<main id="list"></main>
<footer>
  <button id="open"><svg viewBox="0 0 24 24"><path d="M5 19l2.757-7.351A1 1 0 0 1 8.693 11H21a1 1 0 0 1 .986 1.164l-.996 5.211A2 2 0 0 1 19.026 19z"/><path d="M19 9V7a2 2 0 0 0-2-2h-6l-3-3H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2"/></svg>Abrir carpeta</button>
  <button id="add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Añadir pack</button>
  <input type="file" id="file" accept=".streamDeckIconPack,.zip" hidden>
  <span class="spacer"></span>
  <button id="close">Cerrar</button>
</footer>

<script>
const TRASH = '<svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-12M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/></svg>';
const $ = (id) => document.getElementById(id);
const busy = new Set();
let packs = [];

function msg(text, kind) {
  const m = $('msg'); m.textContent = text || ''; m.className = text ? kind : '';
  if (text) setTimeout(() => { if (m.textContent === text) { m.textContent = ''; m.className = ''; } }, 5000);
}
async function api(path, body) {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Algo ha fallado');
  return j;
}
// ---------- Paleta de colores del pack ----------
const palettes = new Map();   // clave id|count -> [{c:'#rrggbb', w:0..1}]
const computing = new Set();
const palKey = (p) => `${p.id}|${p.count}`;
try { const s = JSON.parse(localStorage.getItem('palettes') || '{}'); for (const k in s) palettes.set(k, s[k]); } catch (_) {}
function savePalettes() { try { localStorage.setItem('palettes', JSON.stringify(Object.fromEntries(palettes))); } catch (_) {} }

function paletteHTML(p) {
  const pal = palettes.get(palKey(p));
  if (!pal) { computePalette(p); return ''; }
  return pal.map((x) => `<span style="background:${x.c};flex:${x.w}" title="${x.c}"></span>`).join('');
}

function loadImg(src) {
  return new Promise((res) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });
}

async function computePalette(p) {
  const key = palKey(p);
  if (computing.has(key) || !p.samples || !p.samples.length) return;
  computing.add(key);
  const S = 32, cv = document.createElement('canvas'); cv.width = cv.height = S;
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  const buckets = new Map();   // color cuantizado (4 bits/canal) -> {n, r, g, b}
  for (const src of p.samples) {
    const img = await loadImg(src);
    if (!img) continue;
    ctx.clearRect(0, 0, S, S); ctx.drawImage(img, 0, 0, S, S);
    const d = ctx.getImageData(0, 0, S, S).data;
    for (let i = 0; i < d.length; i += 4) {
      if (d[i + 3] < 128) continue;                     // transparente
      const r = d[i], g = d[i + 1], b = d[i + 2];
      const k = ((r >> 4) << 8) | ((g >> 4) << 4) | (b >> 4);
      const e = buckets.get(k) || { n: 0, r: 0, g: 0, b: 0 };
      e.n++; e.r += r; e.g += g; e.b += b; buckets.set(k, e);
    }
  }
  // Ordena por frecuencia y fusiona colores parecidos; se queda con los 5 principales
  const cols = [...buckets.values()].map((e) => ({ n: e.n, r: e.r / e.n, g: e.g / e.n, b: e.b / e.n })).sort((a, b) => b.n - a.n);
  const picked = [];
  for (const c of cols) {
    const near = picked.find((q) => Math.hypot(q.r - c.r, q.g - c.g, q.b - c.b) < 48);
    if (near) { near.n += c.n; continue; }
    if (picked.length < 5) picked.push({ ...c });
  }
  const total = picked.reduce((s, c) => s + c.n, 0) || 1;
  const hex = (v) => Math.round(v).toString(16).padStart(2, '0');
  const pal = picked.map((c) => ({ c: `#${hex(c.r)}${hex(c.g)}${hex(c.b)}`, w: +(c.n / total).toFixed(3) }));
  palettes.set(key, pal); savePalettes(); computing.delete(key);
  const el = document.querySelector(`[data-pal="${CSS.escape(p.id)}"]`);
  if (el) el.innerHTML = paletteHTML(p);
}

function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

function render() {
  const L = $('list');
  const inst = packs.filter((p) => p.installed).length;
  $('sum').textContent = `${inst} de ${packs.length} instalados`;
  if (!packs.length) {
    L.innerHTML = '<div class="empty"><b>Añade tu primer pack</b>Pulsa "Añadir pack" o descarga un .streamDeckIconPack y aparecerá aquí.</div>';
    return;
  }
  L.innerHTML = '';
  for (const p of packs) {
    const isBusy = busy.has(p.id);
    const row = document.createElement('div');
    row.className = 'row';
    const thumbs = p.thumbs.length ? p.thumbs.map((t) => `<img src="${t}" alt="" loading="lazy">`).join('') : '<span></span><span></span><span></span>';
    row.innerHTML = `
      <input type="checkbox" ${p.installed ? 'checked' : ''} ${isBusy ? 'disabled' : ''}
             title="${p.installed ? 'Instalado. Usa la papelera para desinstalar' : 'Marcar para instalar'}" aria-label="Instalar ${esc(p.name)}">
      <div class="thumbs">${thumbs}</div>
      <div style="min-width:0"><div class="name" title="${esc(p.name)}">${esc(p.name)}</div><div class="count">${p.count} iconos</div></div>
      <div class="palette" data-pal="${esc(p.id)}" title="Colores del pack">${paletteHTML(p)}</div>
      <span class="badge ${isBusy ? 'busy' : p.installed ? 'ok' : ''}">${isBusy ? 'Trabajando…' : p.installed ? 'Instalado' : 'Disponible'}</span>
      <button class="trash" ${p.installed && !isBusy ? '' : 'disabled'} title="Desinstalar (borra los iconos)" aria-label="Desinstalar ${esc(p.name)}">${TRASH}</button>`;
    const cb = row.querySelector('input');
    cb.addEventListener('click', (e) => {
      if (p.installed) { e.preventDefault(); return; }  // la casilla solo instala
      run(p, '/api/install', `Instalado "${p.name}"`);
    });
    row.querySelector('.trash').addEventListener('click', () => {
      if (!p.installed || busy.has(p.id)) return;
      const extra = p.onlyInstalled ? '\n\nEste pack no tiene copia en IconPacks: desaparecerá de la lista.' : '';
      if (confirm(`¿Desinstalar "${p.name}"? Se borrarán sus ${p.count} iconos de la carpeta Icons.${extra}`)) {
        run(p, '/api/uninstall', `Desinstalado "${p.name}"`);
      }
    });
    L.appendChild(row);
  }
}

async function run(p, endpoint, okText) {
  busy.add(p.id); render();
  try { await api(endpoint, { id: p.id }); msg(okText, 'ok'); }
  catch (e) { msg(e.message, 'err'); }
  finally { busy.delete(p.id); await refresh(); }
}

async function refresh() {
  try {
    const r = await fetch('/api/packs', { cache: 'no-store' });
    const j = await r.json();
    $('path').textContent = j.icons;
    packs = j.packs;
    render();
  } catch (_) { msg('No se puede conectar con el plugin. ¿Está OpenDeck abierto?', 'err'); }
}

$('open').onclick = () => api('/api/open-folder').catch((e) => msg(e.message, 'err'));
$('add').onclick = () => $('file').click();
$('close').onclick = () => window.close();
$('file').onchange = async (e) => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  if (!/\.(streamdeckiconpack|zip)$/i.test(f.name)) { msg('Elige un archivo .streamDeckIconPack o .zip', 'err'); return; }
  msg(`Añadiendo "${f.name}"…`, 'ok');
  try {
    const r = await fetch('/api/upload?name=' + encodeURIComponent(f.name), { method: 'POST', body: f });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'No se pudo añadir el pack');
    msg(`Añadido "${j.name}" (${j.count} iconos). Márcalo para instalarlo.`, 'ok');
  } catch (err) { msg(err.message, 'err'); }
  refresh();
};

refresh();
setInterval(() => { if (!busy.size) refresh(); }, 3000);  // recoge lo que llegue de Descargas
</script>
</body>
</html>
